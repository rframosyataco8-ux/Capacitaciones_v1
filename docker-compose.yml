# OnlyOffice Document Server — edicion Word/Excel/PPT casi igual a Office Online
# Requisitos: Docker Desktop instalado
# Uso:
#   docker compose up -d
#   Abrir http://localhost:8080  (OnlyOffice)
#   CapaciHub sigue en http://localhost:5173
#
# Nota: la integracion completa (abrir .docx de CapaciHub dentro de OnlyOffice)
# requiere un backend que sirva los archivos por HTTP. Por ahora puedes usar
# OnlyOffice de forma independiente subiendo archivos alli.

services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: capacihub-onlyoffice
    ports:
      - "8080:80"
    environment:
      - JWT_ENABLED=false
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
    restart: unless-stopped

volumes:
  onlyoffice_data:
